<!doctype html>
<html lang="ru" data-style="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borisova — студия маникюра в Нижнем Новгороде, Кожевенная улица, 1а лит А</title>
<meta name="description" content="Женский педикюр, мужской маникюр, японский маникюр, гель-лак. Называют студию уютной, с приятной атмосферой. Кожевенная улица, 1а лит А, Нижний Новгород. 5,0 в 2ГИС. Тел.: +7 (904) 915-54-34.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&family=Unbounded:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ---------- tokens per style (references: Monotone, Nailé, Luxé, Iceland) ---------- */
:root { --accent: #8f7a66; --max: 1760px; --gut: clamp(16px, 2.6vw, 44px); }
[data-style="mono"]  { --bg:#f3eee6; --bg2:#1a1a1a; --ink:#141414; --ink2:#5d5a55; --line:#141414; --card:#fffdf8; --on2:#f3eee6;
  --head:"Oswald", Impact, sans-serif; --body:"Manrope", system-ui, sans-serif; --r:0px; --upper:uppercase; --hw:700; --track:-.01em; }
[data-style="blush"] { --bg:#fbf5f3; --bg2:#f3e3df; --ink:#2b2023; --ink2:#7b6a6d; --line:#ecd9d4; --card:#ffffff; --on2:#2b2023;
  --head:"Cormorant Garamond", Georgia, serif; --body:"Manrope", system-ui, sans-serif; --r:18px; --upper:none; --hw:500; --track:-.01em; }
[data-style="luxe"]  { --bg:#0f0d0c; --bg2:#e9ddcc; --ink:#f1e9de; --ink2:#a99c8c; --line:#3a332d; --card:#181513; --on2:#1b1714;
  --head:"Cormorant Garamond", Georgia, serif; --body:"Manrope", system-ui, sans-serif; --r:2px; --upper:uppercase; --hw:300; --track:.02em; }
[data-style="glass"] { --bg:#1d2226; --bg2:rgba(255,255,255,.1); --ink:#ffffff; --ink2:rgba(255,255,255,.74); --line:rgba(255,255,255,.26); --card:rgba(255,255,255,.12); --on2:#ffffff;
  --head:"Unbounded", system-ui, sans-serif; --body:"Manrope", system-ui, sans-serif; --r:22px; --upper:uppercase; --hw:200; --track:.04em; --max:100%; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gut); }
h1, h2, h3 { font-family: var(--head); font-weight: var(--hw); text-transform: var(--upper); letter-spacing: var(--track); line-height: 1.02; margin: 0; }
h2 { font-size: clamp(34px, 5.2vw, 64px); }
.kicker { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink2); margin: 0 0 14px; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 26px; border-radius: calc(var(--r) * 4); background: var(--ink); color: var(--bg);
  text-decoration: none; font-weight: 600; font-size: 14px; letter-spacing: .04em; border: 1px solid var(--ink); transition: transform .2s, background .2s, color .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn .arr { transition: transform .2s; } .btn:hover .arr { transform: translateX(4px); }
section { padding: clamp(48px, 5.5vw, 88px) 0; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 32px; }
.sec-head p { max-width: 520px; color: var(--ink2); margin: 0; }

/* ---------- header ---------- */
header.top { position: fixed; inset: 0 0 auto; z-index: 50; transition: background .3s, box-shadow .3s; }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 20px; }
.logo { font-family: var(--head); font-weight: 600; font-size: 22px; text-decoration: none; text-transform: var(--upper); letter-spacing: var(--track); line-height: 1; }
.logo small { display: block; font: 500 10px/1.4 var(--body); letter-spacing: .24em; text-transform: uppercase; color: var(--ink2); margin-top: 3px; }
nav.menu { display: flex; gap: 28px; font-size: 14px; }
nav.menu a { text-decoration: none; opacity: .85; } nav.menu a:hover { opacity: 1; }
header.top .btn { padding: 11px 18px; font-size: 13px; }
header.top.solid { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--line); }
@media (max-width: 860px) { nav.menu { display: none; } }

/* ---------- hero: common ---------- */
.hero { position: relative; padding: 0; overflow: hidden; }
.hero .meta { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); margin-top: 26px; }
.hero .meta b { color: var(--ink); font-weight: 600; }
.stars { color: var(--accent); letter-spacing: 2px; }

/* mono: giant condensed type under a black-and-white photo */
[data-style="mono"] .hero { padding-top: 72px; }
[data-style="mono"] .hero .photo { position: relative; height: min(64vh, 620px); background: #222; overflow: hidden; }
[data-style="mono"] .hero .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); transform: scale(1.06); animation: settle 2.2s cubic-bezier(.2,.7,.2,1) forwards; }
[data-style="mono"] .hero .photo .brand { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%); color: #fff; text-align: center; font-family: var(--head); font-size: clamp(40px, 7vw, 86px); font-weight: 700; text-transform: uppercase; text-shadow: 0 4px 30px rgba(0,0,0,.35); }
[data-style="mono"] .hero .photo .brand small { display: block; font: 600 12px var(--body); letter-spacing: .3em; margin-top: 8px; }
[data-style="mono"] .hero .giant { background: var(--bg2); color: var(--on2); font-family: var(--head); font-weight: 700; text-transform: uppercase; text-align: center;
  font-size: 190px; line-height: .86; padding: 18px 8px 10px; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; }
[data-style="mono"] .hero .under { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; padding: 40px 0 10px; align-items: end; }
[data-style="mono"] .hero .under p { margin: 0; font-size: 18px; max-width: 520px; }
[data-style="mono"] .hero .under .act { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 760px) { [data-style="mono"] .hero .under { grid-template-columns: 1fr; } [data-style="mono"] .hero .under .act { justify-content: flex-start; } }

/* blush: serif headline left, rounded photo right, handwritten notes */
[data-style="blush"] .hero { padding: 120px 0 40px; background: linear-gradient(180deg, #f6e6e2 0%, var(--bg) 100%); }
[data-style="blush"] .hero .grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
[data-style="blush"] .hero h1 { font-size: clamp(46px, 6.4vw, 86px); font-weight: 500; }
[data-style="blush"] .hero h1 em { font-style: italic; color: var(--accent); }
[data-style="blush"] .hero p.lead { font-size: 18px; color: var(--ink2); max-width: 470px; margin: 22px 0 30px; }
[data-style="blush"] .hero .photo { position: relative; aspect-ratio: 4/4.4; border-radius: 220px 220px 24px 24px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(120,60,60,.45); }
[data-style="blush"] .hero .photo img { width: 100%; height: 100%; object-fit: cover; }
[data-style="blush"] .script { font-family: "Caveat", cursive; color: var(--accent); font-size: 30px; line-height: 1; transform: rotate(-8deg); position: absolute; }
[data-style="blush"] .hero .script { right: -10px; top: 18px; background: #fff; padding: 12px 16px; border-radius: 14px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.2); }
[data-style="blush"] .chips { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 34px; }
[data-style="blush"] .chips div { font-size: 13px; color: var(--ink2); } [data-style="blush"] .chips b { display: block; color: var(--ink); font-size: 14px; }
@media (max-width: 860px) { [data-style="blush"] .hero .grid { grid-template-columns: 1fr; } [data-style="blush"] .hero .photo { max-width: 420px; } }

/* luxe: dark full-bleed photo, thin uppercase serif, gold rule */
[data-style="luxe"] .hero { min-height: 100vh; display: flex; align-items: center; }
[data-style="luxe"] .hero .bgph { position: absolute; inset: 0; }
[data-style="luxe"] .hero .bgph img { width: 100%; height: 100%; object-fit: cover; opacity: .55; transform: scale(1.08); animation: settle 2.6s cubic-bezier(.2,.7,.2,1) forwards; }
[data-style="luxe"] .hero .bgph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0f0d0c 0%, rgba(15,13,12,.75) 45%, rgba(15,13,12,.2) 100%), linear-gradient(0deg, #0f0d0c 0%, transparent 35%); }
[data-style="luxe"] .hero .wrap { position: relative; width: 100%; padding-top: 110px; padding-bottom: 60px; }
[data-style="luxe"] .hero h1 { font-size: clamp(48px, 8vw, 112px); font-weight: 300; max-width: 900px; }
[data-style="luxe"] .hero .rule { width: 90px; height: 1px; background: var(--accent); margin: 28px 0; }
[data-style="luxe"] .hero p.lead { color: var(--ink2); max-width: 440px; font-size: 17px; margin: 0 0 32px; }
[data-style="luxe"] .btn { background: var(--accent); color: #17120e; border-color: var(--accent); border-radius: 2px; text-transform: uppercase; font-size: 12px; letter-spacing: .16em; }
[data-style="luxe"] .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
[data-style="luxe"] .seal { position: absolute; right: var(--gut); bottom: 60px; width: 150px; height: 150px; border: 1px solid var(--accent); border-radius: 50%; display: grid; place-items: center; text-align: center; color: var(--accent); font-family: var(--head); font-size: 54px; animation: spin 40s linear infinite; }
[data-style="luxe"] .seal small { position: absolute; inset: 10px; font: 500 9px/1 var(--body); letter-spacing: .3em; }
@media (max-width: 860px) { [data-style="luxe"] .seal { display: none; } }

/* glass: full-bleed photo, frosted panel, huge thin letters split across */
[data-style="glass"] .hero { min-height: 100vh; display: flex; align-items: stretch; padding: 92px var(--gut) var(--gut); }
[data-style="glass"] .hero .bgph { position: absolute; inset: 0; }
[data-style="glass"] .hero .bgph img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); animation: settle 2.4s cubic-bezier(.2,.7,.2,1) forwards; }
[data-style="glass"] .hero .bgph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,.05) 60%); }
[data-style="glass"] .hero .frame { position: relative; flex: 1; display: grid; grid-template-columns: minmax(300px, 38%) 1fr; border-radius: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,.35); }
[data-style="glass"] .hero .panel { backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2); background: rgba(255,255,255,.18); color: #fff; padding: 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 30px; }
[data-style="glass"] .hero .panel .kicker { color: rgba(255,255,255,.85); }
[data-style="glass"] .hero .num { font: 200 44px/1 "Unbounded"; color: #fff; }
[data-style="glass"] .hero .panel p { color: rgba(255,255,255,.88); margin: 12px 0 0; font-size: 15px; max-width: 360px; }
[data-style="glass"] .hero .big { position: absolute; left: calc(var(--gut) + max(300px, 38%) + 3%); right: calc(var(--gut) + 3%); bottom: calc(var(--gut) + 5%); pointer-events: none;
  font: 200 160px/.92 "Unbounded"; color: #fff; text-transform: uppercase; letter-spacing: .02em; text-align: right; white-space: nowrap; }
[data-style="glass"] .hero .big span { display: block; } [data-style="glass"] .hero .big span:first-child { color: rgba(255,255,255,.72); }
[data-style="glass"] .hero .btn { background: #fff; color: #1b2024; border-color: #fff; }
[data-style="glass"] .hero .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
[data-style="glass"] header.top:not(.solid) { color: #fff; } [data-style="glass"] header.top:not(.solid) .logo small { color: rgba(255,255,255,.75); }
[data-style="glass"] header.top:not(.solid) .btn { background: #fff; color: #1b2024; border-color: #fff; }
/* glass: the whole page continues the first screen - same photo, blurred, behind frosted panels */
[data-style="glass"] body { background: #1d2226; }
[data-style="glass"] body::before { content: ""; position: fixed; inset: -60px; z-index: -1; background: var(--photo) center / cover no-repeat; filter: blur(46px) saturate(1.15) brightness(.5); }
[data-style="glass"] .card, [data-style="glass"] .price-group, [data-style="glass"] .score, [data-style="glass"] .point,
[data-style="glass"] .glass-panel, [data-style="glass"] footer .cols, [data-style="glass"] .map {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); border-radius: 26px;
  backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2); }
[data-style="glass"] .card .ph { margin: 10px 10px 0; border-radius: 18px; }
[data-style="glass"] .card .ph .n { color: #fff; }
[data-style="glass"] .card .price { color: #fff; font-weight: 600; }
[data-style="glass"] .card .price::before { content: ""; display: inline-block; width: 18px; height: 1px; background: rgba(255,255,255,.7); vertical-align: middle; margin-right: 10px; }
[data-style="glass"] h2 { font-weight: 200; }
[data-style="glass"] .kicker { color: rgba(255,255,255,.8); }
[data-style="glass"] .btn { background: #fff; color: #1b2024; border-color: #fff; }
[data-style="glass"] .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
[data-style="glass"] header.top.solid { background: rgba(24,28,32,.42); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 1px 0 rgba(255,255,255,.18); }
/* "why" band = a second hero-like frame: frosted panel on the left, photo on the right */
[data-style="glass"] .band { background: transparent; }
[data-style="glass"] .band .grid2 { grid-template-columns: minmax(300px, 46%) 1fr; gap: 0; border-radius: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,.28); align-items: stretch; }
[data-style="glass"] .band .grid2 > div:first-child { background: rgba(255,255,255,.12); backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2); padding: clamp(28px, 3vw, 48px); }
[data-style="glass"] .band .photo { aspect-ratio: auto; min-height: 420px; border-radius: 0; }
[data-style="glass"] .feats .ic { border-color: rgba(255,255,255,.5); color: #fff; }
[data-style="glass"] .tags span { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.08); }
[data-style="glass"] .price-group h3 { font-weight: 300; font-size: 20px; }
[data-style="glass"] .row b { font-weight: 500; }
[data-style="glass"] .score .v { font-weight: 200; }
[data-style="glass"] .point q { font-size: 17px; }
/* CTA = frame with the photo, like the first screen */
[data-style="glass"] .cta.band { padding-left: var(--gut); padding-right: var(--gut); }
[data-style="glass"] .cta .wrap { position: relative; border-radius: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,.3); padding: clamp(48px, 7vw, 110px) 24px; isolation: isolate; }
[data-style="glass"] .cta .wrap::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgba(0,0,0,.5), rgba(0,0,0,.15)), var(--photo) center / cover; }
[data-style="glass"] .cta .wrap::after { content: ""; position: absolute; inset: 0; z-index: -1; backdrop-filter: blur(6px); }
[data-style="glass"] .contact { gap: 16px; }
[data-style="glass"] .contact > div:first-child { padding: clamp(24px, 3vw, 40px); }
[data-style="glass"] footer { border-top: 0; padding-top: 0; }
[data-style="glass"] footer .cols { padding: 32px; }
[data-style="glass"] footer .legal { border-top-color: rgba(255,255,255,.2); }
@media (max-width: 860px) { [data-style="glass"] .band .grid2 { grid-template-columns: 1fr; } [data-style="glass"] .band .photo { min-height: 280px; } }
@media (max-width: 860px) { [data-style="glass"] .hero .frame { grid-template-columns: 1fr; } [data-style="glass"] .hero .panel { margin-top: 34vh; } [data-style="glass"] .hero .big { left: calc(var(--gut) + 20px); right: calc(var(--gut) + 20px); top: 120px; bottom: auto; text-align: left; } }
[data-style="luxe"] header.top .btn, [data-style="mono"] header.top .btn { border-radius: var(--r); }

/* ---------- services: photo cards ---------- */
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
@media (min-width: 1300px) { .cards { grid-template-columns: repeat(var(--cols, 4), 1fr); } }
.card { background: var(--card); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); transition: transform .35s, box-shadow .35s; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-6px); box-shadow: 0 24px 50px -28px rgba(0,0,0,.35); }
.card .ph { aspect-ratio: 1/1; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--bg)) 0%, var(--bg2) 100%); overflow: hidden; position: relative; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; } .card:hover .ph img { transform: scale(1.06); }
.card .ph .n { position: absolute; left: 14px; bottom: 10px; font: 200 54px/1 var(--head); color: var(--on2); opacity: .8; }
.card .body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h3 { font-size: 20px; font-weight: 600; text-transform: none; letter-spacing: 0; font-family: var(--body); line-height: 1.25; }
.card p { margin: 0; color: var(--ink2); font-size: 14px; }
.card .price { margin-top: auto; padding-top: 10px; font-weight: 700; color: var(--accent); }
[data-style="mono"] .card { border: 0; background: transparent; } [data-style="mono"] .card .ph img { filter: grayscale(.25); }
[data-style="mono"] .card h3 { font: 600 15px/1.2 var(--head); text-transform: uppercase; letter-spacing: .02em; }
[data-style="mono"] .card .price { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
[data-style="luxe"] .card { background: transparent; border: 0; } [data-style="luxe"] .card .ph { aspect-ratio: 3/4; }
[data-style="luxe"] .card h3 { font: 400 14px/1.3 var(--body); letter-spacing: .14em; text-transform: uppercase; }

/* ---------- dark band (mono pedicure block / luxe beige / blush offer / glass dark) ---------- */
.band { background: var(--bg2); color: var(--on2); }
.band .kicker, .band p { color: color-mix(in srgb, var(--on2) 70%, transparent); }
.band .grid2 { display: grid; grid-template-columns: 1fr 1.1fr; gap: 50px; align-items: center; }
.band .photo { border-radius: var(--r); overflow: hidden; aspect-ratio: 4/3; background: #222; } .band .photo img { width: 100%; height: 100%; object-fit: cover; }
.feats { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 30px; margin-top: 34px; }
.feats h3 { font: 600 17px/1.3 var(--body); text-transform: none; letter-spacing: 0; margin-bottom: 6px; }
.feats p { margin: 0; font-size: 14px; }
.feats .ic { width: 38px; height: 38px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--on2) 35%, transparent); display: grid; place-items: center; margin-bottom: 12px; color: var(--accent); font-size: 16px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 30px; }
.tags span { padding: 7px 14px; border: 1px solid color-mix(in srgb, var(--on2) 30%, transparent); border-radius: 999px; font-size: 13px; }
@media (max-width: 860px) { .band .grid2, .feats { grid-template-columns: 1fr; } }
[data-style="mono"] .band h2::after { content: "(" attr(data-n) ")"; font-size: .3em; vertical-align: super; margin-left: 6px; }

/* ---------- price list ---------- */
.prices { columns: 3 360px; column-gap: 20px; }
.price-group { break-inside: avoid; margin: 0 0 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 24px 26px; }
.price-group h3 { font-size: 24px; margin-bottom: 12px; }
[data-style="blush"] .price-group h3 { font-weight: 600; }
.row { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; font-size: 15px; }
.row + .row { border-top: 1px dashed var(--line); }
.row .dots { flex: 1; } .row b { white-space: nowrap; font-weight: 600; }
.note { color: var(--ink2); font-size: 14px; margin-top: 8px; }
[data-style="mono"] .price-group { background: transparent; border: 0; border-top: 2px solid var(--ink); border-radius: 0; padding: 18px 0; }

/* ---------- gallery strip ---------- */
/* gallery fills the whole row: few photos get wide, many photos wrap into an even grid */
.strip { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.strip img { width: 100%; height: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: var(--r); }
.strip.few img { aspect-ratio: 4/3; }
[data-style="luxe"] .strip img { aspect-ratio: 3/4; }

/* ---------- reviews ---------- */
.rev-grid { display: grid; grid-template-columns: 300px 1fr; gap: 40px; align-items: start; }
.score { border: 1px solid var(--line); border-radius: var(--r); padding: 30px; text-align: center; background: var(--card); text-decoration: none; display: block; }
.score .v { font: var(--hw) 72px/1 var(--head); } .score .stars { font-size: 20px; } .score p { color: var(--ink2); margin: 8px 0 0; font-size: 14px; }

    ((k.phones || []).length ? '<div><dt>Телефон</dt><dd>' + k.phones.map(function (p) { return '<a href="tel:' + e(p.replace(/[^+\d]/g, "")) + '">' + e(p) + '</a>'; }).join("<br>") + '</dd></div>' : '') +
    ((k.hours || []).length ? '<div><dt>Часы работы</dt><dd><div class="hours">' + k.hours.map(function (r) { return '<span>' + e(r[0]) + '</span><span>' + e(r[1]) + '</span>'; }).join("") + '</div>' + (k.hours_note ? '<span class="note">' + e(k.hours_note) + '</span>' : '') + '</dd></div>' : '') +
    '</dl><div class="msgr">' + ms.join("") + '</div></div><div class="map rv d1">' + map + '</div></div></div></section>');

  // ---- footer ----
  out.push('<footer><div class="wrap"><div class="cols"><div><a class="logo" href="#">' + e(b.name) + '<small>' + e(b.kind) + '</small></a><p class="note">' + e(k.address) + '</p></div>' +
    '<div><h4>Разделы</h4><a href="#services">Услуги</a><a href="#prices">Цены</a><a href="#reviews">Отзывы</a><a href="#contacts">Контакты</a></div>' +
    '<div><h4>Связаться</h4>' + (k.phones || []).slice(0, 2).map(function (p) { return '<a href="tel:' + e(p.replace(/[^+\d]/g, "")) + '">' + e(p) + '</a>'; }).join("") +
    (k.wa ? '<a href="' + e(k.wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + (k.tg ? '<a href="' + e(k.tg) + '" target="_blank" rel="noopener">Telegram</a>' : '') + (k.vk ? '<a href="' + e(k.vk) + '" target="_blank" rel="noopener">ВКонтакте</a>' : '') + '</div>' +
    '<div><h4>Запись</h4>' + (k.booking ? '<a href="' + e(k.booking) + '" target="_blank" rel="noopener">Онлайн-запись</a>' : '') + '<a href="' + e(k.gis) + '" target="_blank" rel="noopener">Мы в 2ГИС</a>' + (k.hours_line ? '<p class="note">' + e(k.hours_line) + '</p>' : '') + '</div></div>' +
    '<div class="legal"><span>© ' + new Date().getFullYear() + ' ' + e(b.name) + ', ' + e(b.city) + '</span><span>' + e(C.footer_note) + '</span></div></div></footer>');
  out.push('<div class="mbar"><a href="' + e("tel:" + ((k.phones || [""])[0]).replace(/[^+\d]/g, "")) + '">Позвонить</a><a href="' + e(book) + '" target="_blank" rel="noopener">Записаться</a></div>');

  document.getElementById("app").innerHTML = out.join("");

  // giant words (mono band, glass letters) shrink until they fit their box, like the references
  var fit = function () {
    document.querySelectorAll(".hero .giant, .hero .big").forEach(function (el) {
      var max = el.classList.contains("giant") ? 190 : 160, s = max, w = el.clientWidth - 16;
      el.style.fontSize = s + "px";
      var widest = function () { return el.classList.contains("big") ? Math.max.apply(null, [].map.call(el.children, function (c) { return c.scrollWidth; })) : el.scrollWidth; };
      while (s > 28 && widest() > w) { s -= 4; el.style.fontSize = s + "px"; }
    });
  };
  fit(); addEventListener("resize", fit); if (document.fonts) document.fonts.ready.then(fit);

  // header becomes solid after the first screen; scroll reveals
  var top = document.getElementById("top");
  var onScroll = function () { top.classList.toggle("solid", window.scrollY > 60); };
  addEventListener("scroll", onScroll, { passive: true }); onScroll();
  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (en) { en.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }); }, { threshold: .12 }) : null;
  document.querySelectorAll(".rv").forEach(function (el) { io ? io.observe(el) : el.classList.add("in"); });
  // a broken photo should not leave an empty frame
  document.querySelectorAll("img").forEach(function (im) { im.addEventListener("error", function () { var c = im.closest(".card .ph, .strip"); if (im.closest(".strip")) im.remove(); else im.style.visibility = "hidden"; }); });
})();
</script>
