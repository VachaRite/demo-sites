<!doctype html>
<html lang="ru" data-mode="light" data-head="unbounded" data-body="manrope" data-hero="full" data-mark="accent" data-cards="sharp" data-order="stats,why,services,works,reviews,prices" style="--accent: #3b82f6; --on-accent: #fff;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Четверка — автосервис в Ярославле, Мельничная ул., 70</title>
<meta name="description" content="Автосервис Четверка в Ярославле: ходовая, бензиновые и дизельные двигатели, АКПП и МКПП, охлаждение, видеорегистраторы. 4.8 на Яндекс Картах, 122 отзыва. Телефон: +7 (903) 825-62-66.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Unbounded:wght@500;700;800;900&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff5a1f;
    --on-accent: #fff;
    --accent-2: color-mix(in srgb, var(--accent) 82%, #fff);
    --accent-soft: color-mix(in srgb, var(--accent) 50%, transparent);
    --bg: #0b0b0d;
    --panel: #141417;
    --panel-2: #1b1b1f;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.28);
    --ink: #f4f4f5;
    --soft-ink: rgba(255,255,255,.72);
    --muted: #9a9aa3;
    --radius: 14px;
    --head: "Unbounded", "Manrope", system-ui, sans-serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --head-case: uppercase;
    --head-weight: 800;
    --head-track: -0.01em;
  }
  /* colour modes */
  [data-mode="graphite"] { --bg: #15171c; --panel: #1e2128; --panel-2: #252932; --muted: #a3a8b3; }
  [data-mode="navy"] { --bg: #0a1020; --panel: #111a2e; --panel-2: #172238; --line: rgba(160,190,255,.1); --muted: #94a3c0; }
  [data-mode="light"] { --bg: #f5f5f2; --panel: #ffffff; --panel-2: #efefeb; --line: rgba(0,0,0,.09); --line-strong: rgba(0,0,0,.25); --ink: #111317; --soft-ink: rgba(17,19,23,.72); --muted: #5f6570; }
  /* heading and body fonts */
  [data-head="russo"] { --head: "Russo One", var(--body); --head-weight: 400; --head-track: .01em; }
  [data-head="oswald"] { --head: "Oswald", var(--body); --head-weight: 700; --head-track: .01em; }
  [data-head="montserrat"] { --head: "Montserrat", var(--body); --head-weight: 800; --head-case: none; --head-track: -0.02em; }
  [data-head="exo"] { --head: "Exo 2", var(--body); --head-weight: 800; --head-track: 0; }
  [data-head="playfair"] { --head: "Playfair Display", serif; --head-weight: 700; --head-case: none; --head-track: -0.01em; }
  [data-head="rubik"] { --head: "Rubik", var(--body); --head-weight: 800; --head-track: -0.01em; }
  [data-body="golos"] { --body: "Golos Text", system-ui, sans-serif; }
  [data-body="rubik"] { --body: "Rubik", system-ui, sans-serif; }
  /* card shapes */
  [data-cards="sharp"] { --radius: 4px; }
  [data-cards="round"] { --radius: 24px; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--body); color: var(--ink); background: var(--bg); line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  section { padding: 80px 0; position: relative; scroll-margin-top: 70px; }
  h1, h2, h3 { font-family: var(--head); line-height: 1.08; margin: 0; text-transform: var(--head-case); letter-spacing: var(--head-track); }
  h2 { font-size: clamp(24px, 3.2vw, 38px); font-weight: var(--head-weight); }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; display: block; }
  .muted { color: var(--muted); }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 24px; border-radius: calc(var(--radius) * .6); font-weight: 700; font-size: 15px; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; transition: background .15s, transform .15s, border-color .15s; white-space: nowrap; }
  .btn:hover { transform: translateY(-1px); }
  .btn-accent { background: var(--accent); color: var(--on-accent); }
  .btn-accent:hover { background: var(--accent-2); }
  .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
  .btn-outline:hover { border-color: var(--ink); }
  .btn svg { width: 18px; height: 18px; flex: none; }

  /* header */
  .top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 70px; }
  .logo { text-decoration: none; line-height: 1; }
  .logo b { font-family: var(--head); font-weight: var(--head-weight); font-size: 19px; letter-spacing: .02em; text-transform: var(--head-case); display: block; }
  .logo small { font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: var(--accent); }
  .top nav { display: flex; gap: 28px; font-size: 14px; color: var(--soft-ink); }
  .top nav a { text-decoration: none; }
  .top nav a:hover { color: var(--accent); }
  .top .right { display: flex; align-items: center; gap: 18px; }
  .top .phone { font-weight: 700; text-decoration: none; font-size: 15px; white-space: nowrap; }
  .top .btn { padding: 11px 18px; font-size: 14px; }
  @media (max-width: 960px) { .top nav { display: none; } }
  @media (max-width: 560px) { .top .btn { display: none; } }
  @media (max-width: 420px) { .top .phone { display: none; } }

  /* hero */
  .hero { padding: 40px 0 0; overflow: hidden; isolation: isolate; }
  .hero .mark { position: absolute; z-index: -1; top: 6px; left: 50%; transform: translateX(-50%); font-family: var(--head); font-weight: 900; text-transform: uppercase; white-space: nowrap; line-height: .9; font-size: clamp(80px, 17vw, 240px); letter-spacing: -0.03em;
    background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 55%, transparent) 0%, color-mix(in srgb, var(--ink) 14%, transparent) 55%, transparent 100%); -webkit-background-clip: text; background-clip: text; color: transparent; pointer-events: none; user-select: none; }
  [data-mark="outline"] .hero .mark { background: none; -webkit-text-stroke: 1.5px color-mix(in srgb, var(--ink) 22%, transparent); }
  [data-mark="accent"] .hero .mark { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 45%, transparent), transparent 90%); -webkit-background-clip: text; background-clip: text; }
  [data-mark="none"] .hero .mark { display: none; }
  .hero .wrap { display: grid; grid-template-columns: 1fr 1.15fr; gap: 32px; align-items: center; min-height: 520px; padding-top: clamp(40px, 9vw, 120px); }
  .hero h1 { font-size: clamp(28px, 3.8vw, 46px); font-weight: var(--head-weight); margin-bottom: 18px; }
  .hero h1 em { font-style: normal; color: var(--accent); display: block; }
  .hero .sub { color: var(--soft-ink); font-size: 16px; margin: 0 0 28px; max-width: 460px; }
  .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero-photo { position: relative; align-self: stretch; min-height: 380px; }
  .hero-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius); }
  .hero-photo::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); background: linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 20%, transparent) 35%, transparent 60%), linear-gradient(0deg, var(--bg) 0%, transparent 40%); }
  .hero-photo .tag { position: absolute; z-index: 2; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink); }
  .hero-photo .tag i { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--accent); display: grid; place-items: center; color: var(--accent); font-style: normal; }
  @media (max-width: 900px) {
    .hero .wrap { grid-template-columns: 1fr; min-height: 0; }
    .hero-photo { min-height: 260px; }
    .hero-photo::after { background: linear-gradient(0deg, var(--bg) 0%, transparent 45%); }
  }
  /* hero layout "full": photo behind the whole first screen */
  [data-hero="full"] .hero { padding: 0; color: #fff; --ink: #fff; --soft-ink: rgba(255,255,255,.82); --line-strong: rgba(255,255,255,.45); }
  [data-hero="full"] .hero .wrap { grid-template-columns: minmax(0, 660px); min-height: 640px; padding-top: 80px; padding-bottom: 80px; position: static; }
  [data-hero="full"] .hero-photo { position: absolute; inset: 0; min-height: 0; z-index: -2; border-radius: 0; animation: none; }
  [data-hero="full"] .hero-photo img { border-radius: 0; }
  [data-hero="full"] .hero-photo::after { border-radius: 0; background: linear-gradient(90deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.6) 55%, rgba(0,0,0,.3) 100%); }
  [data-hero="full"] .hero .mark { top: auto; bottom: -14px; left: auto; right: -20px; transform: none; z-index: -1; opacity: .55; }
  /* hero layout "center": centered text, wide photo below */
  [data-hero="center"] .hero .wrap { grid-template-columns: 1fr; text-align: center; justify-items: center; min-height: 0; gap: 40px; }
  [data-hero="center"] .hero .sub { margin-left: auto; margin-right: auto; max-width: 620px; }
  [data-hero="center"] .hero .actions { justify-content: center; }
  [data-hero="center"] .hero h1 { font-size: clamp(30px, 4.6vw, 58px); max-width: 900px; }
  [data-hero="center"] .hero-photo { width: 100%; min-height: 0; aspect-ratio: 21 / 8; }
  [data-hero="center"] .hero-photo::after { background: linear-gradient(0deg, var(--bg) 0%, transparent 30%); }
  @media (max-width: 900px) { [data-hero="center"] .hero-photo { aspect-ratio: 4 / 3; } [data-hero="full"] .hero .wrap { min-height: 560px; } }

  /* stats */
  .stats { padding: 28px 0 0; }
  .stats .box { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .stat { padding: 26px 22px; text-align: center; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font-family: var(--head); font-size: clamp(26px, 3vw, 38px); font-weight: var(--head-weight); color: var(--accent); line-height: 1.1; }
  .stat span { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
  .stat small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  @media (max-width: 760px) { .stats .box { grid-template-columns: 1fr 1fr; } .stat { padding: 20px 12px; } .stat:nth-child(2) { border-right: 0; } .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }

  /* services */
  .svc { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .svc .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s; }
  .svc .card:hover { border-color: var(--accent-soft); }
  .svc .card .n { font-family: var(--head); font-size: 13px; color: var(--accent); }
  .svc .card h3 { font-size: 15px; font-weight: 700; letter-spacing: .01em; font-family: var(--body); }
  .svc .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .svc .card .price { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--muted); }
  .svc .card .price b { font-family: var(--head); font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .svc .card .price a { color: var(--accent); font-weight: 700; text-decoration: none; }

  /* why */
  .why .wrap { display: grid; grid-template-columns: .9fr 1.1fr; gap: 48px; align-items: start; }
  .why h2 { font-size: clamp(24px, 3vw, 34px); margin-bottom: 18px; }
  [data-cards="outline"] .svc .card, [data-cards="outline"] .acc details, [data-cards="outline"] .point, [data-cards="outline"] .score, [data-cards="outline"] .stats .box { background: transparent; }
  .acc { display: grid; gap: 10px; }
  .acc details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 18px; }
  .acc summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px 0; }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; }
  .acc summary .ico svg { width: 18px; height: 18px; color: var(--on-accent); }
  .acc summary b { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; flex: 1; }
  .acc summary small { display: block; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 13px; margin-top: 2px; }
  .acc summary::after { content: "+"; font-size: 22px; color: var(--muted); transition: transform .2s; }
  .acc details[open] summary::after { transform: rotate(45deg); }
  .acc details p { margin: 0 0 16px 50px; color: var(--soft-ink); font-size: 14px; }
  @media (max-width: 860px) { .why .wrap { grid-template-columns: 1fr; gap: 28px; } }

  /* gallery carousel */
  .arrows { display: flex; gap: 10px; }
  .arrows button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); cursor: pointer; font-size: 18px; }
  .arrows button:last-child { border-color: var(--accent); color: var(--accent); }
  .track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 42px) / 4); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .track::-webkit-scrollbar { display: none; }
  .track figure { margin: 0; scroll-snap-align: start; }
  .track img { width: 100%; aspect-ratio: 4/3.2; object-fit: cover; border-radius: var(--radius); }
  @media (max-width: 900px) { .track { grid-auto-columns: 70%; } }

  /* prices */
  .ptable { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .ptable .row { display: flex; justify-content: space-between; gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .ptable .row:last-child { border-bottom: 0; }
  .ptable .row b { color: var(--accent); white-space: nowrap; }
  .pnote { margin-top: 14px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 14%, transparent), color-mix(in srgb, var(--accent) 4%, transparent)); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: var(--radius); padding: 22px; display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .pnote p { margin: 0; max-width: 680px; }

  /* reviews */
  .rev { display: grid; grid-template-columns: 280px 1fr; gap: 18px; }
  .score { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
  .score b { font-family: var(--head); font-size: 54px; font-weight: var(--head-weight); color: var(--accent); display: block; line-height: 1; }
  .score .stars { color: var(--accent); font-size: 20px; letter-spacing: 3px; margin: 10px 0 6px; }
  .score p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .score a { display: block; font-size: 13px; font-weight: 700; text-decoration: none; margin-top: 8px; }
  .score a:hover { color: var(--accent); }
  .points { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .point { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; font-size: 14px; display: flex; gap: 12px; text-decoration: none; transition: border-color .2s, transform .2s, background .2s; }
  a.point:hover { border-color: var(--accent-soft); background: var(--panel-2); transform: translateY(-2px); }
  .point span { display: flex; flex-direction: column; gap: 10px; }
  .point em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  a.point:hover em { color: var(--accent); }
  .point::before { content: "“"; font-family: var(--head); font-size: 34px; line-height: .8; color: var(--accent); }
  @media (max-width: 860px) { .rev { grid-template-columns: 1fr; } .points { grid-template-columns: 1fr; } }

  /* lead form */
  .lead { background: linear-gradient(180deg, var(--panel), var(--bg)); border-top: 1px solid var(--line); }
  .lead .wrap { display: grid; grid-template-columns: .9fr 1.1fr; gap: 44px; align-items: start; }
  .lead h2 { margin-bottom: 14px; }
  .lead ul { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 14px; }
  .lead li { display: flex; gap: 12px; align-items: center; font-size: 14px; }
  .lead li i { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--accent); display: grid; place-items: center; color: var(--accent); flex: none; font-style: normal; }
  .lead li i svg { width: 16px; height: 16px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  form input, form textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); padding: 14px 16px; color: var(--ink); font: inherit; font-size: 14px; }
  form input:focus, form textarea:focus { outline: none; border-color: var(--accent); }
  form textarea { grid-column: 1 / -1; min-height: 110px; resize: vertical; }
  form .btn { grid-column: 1 / -1; padding: 16px; }
  form small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  @media (max-width: 860px) { .lead .wrap { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { form { grid-template-columns: 1fr; } }

  /* contacts + footer */
  .contacts .wrap { display: grid; grid-template-columns: 1fr 1.3fr; gap: 18px; }
  .cinfo { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; align-content: start; }
  .cinfo div { display: flex; gap: 14px; }
  .cinfo svg { width: 20px; height: 20px; color: var(--accent); flex: none; margin-top: 3px; }
  .cinfo small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .cinfo a { text-decoration: none; font-weight: 700; font-size: 17px; }
  .map { border-radius: var(--radius); overflow: hidden; min-height: 360px; background: var(--panel); border: 1px solid var(--line); }
  .map iframe { width: 100%; height: 100%; min-height: 360px; border: 0; display: block; filter: grayscale(.2) contrast(1.05); }
  @media (max-width: 860px) { .contacts .wrap { grid-template-columns: 1fr; } }

  footer { border-top: 1px solid var(--line); padding: 48px 0 24px; font-size: 14px; color: #9a9aa3; background: #0a0a0c; --line: rgba(255,255,255,.08); --ink: #fff; --panel: #141417; }
  footer .cols { display: grid; grid-template-columns: 1.3fr 1fr 1.2fr 1fr; gap: 32px; margin-bottom: 32px; }
  footer h4 { margin: 0 0 14px; color: #fff; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  footer .links a { display: block; width: fit-content; text-decoration: none; padding: 4px 0; color: rgba(255,255,255,.72); transition: color .15s, transform .15s; }
  footer .links a:hover { color: var(--accent); transform: translateX(3px); }
  footer .logo b { color: #fff; }
  footer .about { margin: 14px 0 18px; max-width: 280px; }
  footer .btn { padding: 12px 18px; font-size: 14px; }
  footer .ci { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }
  footer .ci svg { width: 16px; height: 16px; color: var(--accent); flex: none; margin-top: 3px; }
  footer .ci a { color: #fff; text-decoration: none; font-weight: 600; }
  footer .ci a:hover { color: var(--accent); }
  footer .ci small { display: block; color: var(--muted); font-size: 12px; }
  footer .soc { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  footer .soc a { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; transition: border-color .15s, color .15s; }
  footer .soc a:hover { border-color: var(--accent); color: var(--accent); }
  footer .bottom { border-top: 1px solid var(--line); padding-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .totop { background: none; border: 1px solid var(--line); color: #fff; border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .15s, color .15s; }
  .totop:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 860px) { footer .cols { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { footer .cols { grid-template-columns: 1fr; } }

  /* motion */
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0s); }
  .reveal.in { opacity: 1; transform: none; }
  .hero .mark { animation: markIn 1.4s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes markIn { from { opacity: 0; letter-spacing: .08em; } to { opacity: 1; letter-spacing: -0.03em; } }

    '<input name="car" placeholder="Марка и модель"><input name="year" placeholder="Год выпуска">' +
    '<textarea name="msg" placeholder="Что случилось с машиной?"></textarea>' +
    '<button class="btn btn-accent" type="submit">' + (L.whatsapp ? "Отправить в WhatsApp" : L.telegram ? "Отправить в Telegram" : "Позвонить и записаться") + I.arrow + '</button>' +
    '<small>' + (L.whatsapp || L.telegram ? "Заявка откроется в мессенджере — останется нажать «Отправить»." : "Откроется звонок в сервис.") + '</small></form></div></section>');

  // contacts
  h.push('<section class="contacts" id="contacts"><div class="wrap"><div class="cinfo"><div style="display:block"><span class="kicker">Контакты</span><h2 style="font-size:24px">' + esc(B.name) + '</h2></div>' +
    (phones.length ? '<div>' + I.phone + '<span><small>Телефон</small>' + phones.map(function (p) { return '<a href="' + tel(p) + '">' + esc(p) + '</a>'; }).join("<br>") + '</span></div>' : "") +
    (ct.address ? '<div>' + I.pin + '<span><small>Адрес</small>' + esc(ct.address) + (ct.address_note ? '<br><span class="muted">' + esc(ct.address_note) + '</span>' : "") + '</span></div>' : "") +
    (ct.hours ? '<div>' + I.clock + '<span><small>Часы работы</small>' + esc(ct.hours) + '</span></div>' : "") +
    (msgr ? '<a class="btn btn-accent" href="' + esc(msgr) + '" target="_blank" rel="noopener">' + I.chat + 'Написать в ' + msgrName + '</a>' : "") +
    '</div><div class="map">' + (ct.yandex_oid ? '<iframe loading="lazy" src="https://yandex.ru/map-widget/v1/?oid=' + esc(ct.yandex_oid) + '&ol=biz&z=16" title="Карта"></iframe>' : "") + '</div></div></section>');

  // footer: every line is a working link (anchor, call, route, map, messenger)
  var fl = function (arr) { return arr.filter(Boolean).join(""); };
  var orgUrl = function (u) { return String(u || "").replace(/\/(reviews|tab\/reviews)\/?$/, "/"); };
  var routeUrl = ct.yandex_oid ? "https://yandex.ru/maps/?mode=routes&rtext=~" + encodeURIComponent(ct.address || "") + "&rtt=auto&oid=" + ct.yandex_oid
                               : (ct.address ? "https://yandex.ru/maps/?text=" + encodeURIComponent(ct.address) : "");
  h.push('<footer><div class="wrap"><div class="cols">' +
    '<div><a class="logo" href="#top"><b>' + esc(B.name) + '</b><small>' + esc(B.tagline || C.niche || "") + '</small></a>' +
      '<p class="about">' + esc(H.eyebrow || "") + '</p>' +
      '<a class="btn btn-accent" href="#lead">' + esc(H.cta || "Записаться") + I.arrow + '</a>' +
      '<div class="soc">' + fl([L.whatsapp && '<a href="' + esc(L.whatsapp) + '" target="_blank" rel="noopener">WhatsApp</a>', L.telegram && '<a href="' + esc(L.telegram) + '" target="_blank" rel="noopener">Telegram</a>', L.vk && '<a href="' + esc(L.vk) + '" target="_blank" rel="noopener">ВКонтакте</a>']) + '</div></div>' +
    '<div><h4>Разделы</h4><div class="links">' + nav.join("") + '<a href="#lead">Записаться</a></div></div>' +
    '<div><h4>Контакты</h4>' + fl([
      phones.length && '<div class="ci">' + I.phone + '<span>' + phones.map(function (p) { return '<a href="' + tel(p) + '">' + esc(p) + '</a>'; }).join("<br>") + '</span></div>',
      ct.address && '<div class="ci">' + I.pin + '<span><a href="' + esc(routeUrl) + '" target="_blank" rel="noopener">' + esc(ct.address) + '</a><small>Построить маршрут ↗</small></span></div>',
      ct.hours && '<div class="ci">' + I.clock + '<span>' + esc(ct.hours) + '</span></div>']) + '</div>' +
    '<div><h4>Мы на картах</h4><div class="links">' + fl([
      L.yandex && '<a href="' + esc(orgUrl(L.yandex)) + '" target="_blank" rel="noopener">Яндекс Карты ↗</a>',
      L["2gis"] && '<a href="' + esc(orgUrl(L["2gis"])) + '" target="_blank" rel="noopener">2ГИС ↗</a>',
      L.yandex && '<a href="' + esc(L.yandex) + '" target="_blank" rel="noopener">Отзывы ↗</a>']) + '</div></div></div>' +
    '<div class="bottom"><span>© ' + new Date().getFullYear() + ' ' + esc(B.name) + '. ' + esc(C.footer_note || "") + '</span><button class="totop" type="button">Наверх ↑</button></div></div></footer>');

  if (mainPhone) h.push('<div class="callbar"><a class="btn btn-accent" href="' + tel(mainPhone) + '">' + I.phone + 'Позвонить</a>' + (msgr ? '<a class="btn btn-outline" style="background:var(--panel)" href="' + esc(msgr) + '" target="_blank" rel="noopener">' + msgrName + '</a>' : "") + '</div>');

  document.getElementById("app").innerHTML = h.join("");

  // theme decides the order of the middle blocks (between the first screen and the form)
  var order = (document.documentElement.getAttribute("data-order") || "").split(",").filter(Boolean);
  var leadEl = document.getElementById("lead");
  order.forEach(function (key) {
    var el = key === "stats" ? document.querySelector("section.stats") : document.getElementById(key);
    if (el) leadEl.parentNode.insertBefore(el, leadEl);
  });

  // scroll reveal with a small stagger inside each group
  var groups = [".sec-head", ".svc .card", ".stat", ".why .wrap > div:first-child", ".acc details", ".track figure", ".ptable, .pnote",
                ".score", ".point", ".lead .wrap > div", "#leadform", ".cinfo", ".map"];
  groups.forEach(function (sel) {
    document.querySelectorAll(sel).forEach(function (el, i) { el.classList.add("reveal"); el.style.setProperty("--d", Math.min(i, 6) * 0.08 + "s"); });
  });
  document.querySelectorAll("section > .wrap > h2, section > .wrap > .kicker").forEach(function (el) { el.classList.add("reveal"); });
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".reveal").forEach(function (el) { io.observe(el); });
  } else {
    document.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in"); });
  }

  // count-up for numeric stats
  document.querySelectorAll(".stat b").forEach(function (b) {
    var m = b.textContent.match(/^(\d+)([.,]\d+)?$/);
    if (!m) return;
    var target = parseFloat(b.textContent.replace(",", ".")), dec = m[2] ? m[2].length - 1 : 0, done = false;
    var run = function () {
      if (done) return; done = true;
      var t0 = performance.now();
      (function tick(t) {
        var k = Math.min((t - t0) / 1200, 1), v = target * (1 - Math.pow(1 - k, 3));
        b.textContent = v.toFixed(dec);
        if (k < 1) requestAnimationFrame(tick);
      })(t0);
    };
    if ("IntersectionObserver" in window) new IntersectionObserver(function (es, o) { if (es[0].isIntersecting) { run(); o.disconnect(); } }).observe(b);
  });

  document.querySelector(".totop").addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  // in-page links (header, footer, buttons) scroll explicitly instead of relying on the hash jump
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute("href").slice(1);
    var el = id ? document.getElementById(id) : null;
    if (!el && id !== "top" && id !== "") return;
    e.preventDefault();
    var y = el && id !== "top" ? el.getBoundingClientRect().top + window.scrollY - 70 : 0;
    window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
    history.replaceState(null, "", id ? "#" + id : location.pathname);
  });
  // safety net: anything above the current scroll position is shown even if the observer missed it
  var revealPassed = function () {
    document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add("in"); });
  };
  window.addEventListener("scroll", revealPassed, { passive: true });
  setTimeout(revealPassed, 1500);

  var top = document.querySelector(".top");
  window.addEventListener("scroll", function () { top.classList.toggle("scrolled", window.scrollY > 20); }, { passive: true });

  var track = document.querySelector(".track");
  document.querySelectorAll(".arrows button").forEach(function (b) {
    b.addEventListener("click", function () { track.scrollBy({ left: track.clientWidth * 0.75 * Number(b.dataset.dir), behavior: "smooth" }); });
  });

  var form = document.getElementById("leadform");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = form.elements;
    var text = "Здравствуйте! Хочу записаться.\nИмя: " + f.name.value + "\nТелефон: " + f.phone.value +
      (f.car.value ? "\nАвто: " + f.car.value + (f.year.value ? ", " + f.year.value : "") : "") + (f.msg.value ? "\n" + f.msg.value : "");
    if (L.whatsapp) {
      var num = L.whatsapp.replace(/\D/g, "").replace(/^8/, "7");
      window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(text), "_blank");
    } else if (L.telegram) {
      window.open(L.telegram, "_blank");
    } else if (mainPhone) {
      location.href = tel(mainPhone);
    }
  });
})();
</script>
</body>
</html>
