<!doctype html>
<html lang="en" data-style="mono" style="--accent: #f97316; --on-accent: #fff;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor MOT &amp; Repair Centre | MOT, servicing and repairs in Hutton, Preston</title>
<meta name="description" content="Local garage at 82 Liverpool Rd, Hutton, Preston: MOTs, servicing, oil changes, brakes and repairs. Open Monday–Friday 8:30am–5pm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bebas+Neue&family=Instrument+Serif&family=Inter:wght@300;400;500;600;700&family=Oswald:wght@200;300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
/* Three layouts for foreign demos, each follows one reference:
   atelier - Forge Automotive (black, serif, scroll-driven cinematic story)
   mono    - STANQ (light grey monochrome, giant word, centered logo, black band, product cards)
   bold    - MLK logistics (white, rounded photo panel with notches, condensed caps, pills, red accents) */
:root { --accent: #e30613; --on-accent: #fff; }
* { box-sizing: border-box; }
html, body { margin: 0; } html { overflow-x: clip; }
body { font: 15px/1.55 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.split .ch, .split .w { display: inline-block; will-change: transform, opacity, filter; }
.split .w { white-space: nowrap; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
form input, form textarea { width: 100%; padding: 16px 18px; background: transparent; border: 1px solid var(--fl); color: inherit; font: inherit; }
form input:focus, form textarea:focus { outline: none; border-color: var(--accent); }
form textarea, form button, form small { grid-column: 1 / -1; }
form textarea { min-height: 110px; resize: vertical; }
form small { opacity: .6; font-size: 13px; }
.map iframe { width: 100%; height: 100%; min-height: 360px; border: 0; display: block; }
.callbar { display: none; }

/* ====================== ATELIER (Forge) ====================== */
[data-style="atelier"] body { background: #050505; color: #f2efe9; --fl: rgba(255,255,255,.18); }
[data-style="atelier"] .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; letter-spacing: -.01em; }
.at-top { position: fixed; inset: 0 0 auto; z-index: 60; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 22px 30px; mix-blend-mode: difference; color: #fff; }
.at-soc { display: flex; gap: 12px; }
.at-soc a { width: 16px; height: 16px; opacity: .85; } .at-soc svg { width: 16px; height: 16px; }
.at-logo { text-align: center; text-decoration: none; font: 700 11px/1 "Inter"; letter-spacing: .32em; text-transform: uppercase; }
.at-logo i { display: block; margin: 0 auto 6px; width: 18px; height: 10px; border: 2px solid currentColor; border-bottom: 0; border-radius: 10px 10px 0 0; }
.at-nav { justify-self: end; display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; cursor: pointer; font: 600 10px/1 "Inter"; letter-spacing: .3em; }
.at-nav b { width: 16px; height: 9px; border-top: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; }
.at-menu { position: fixed; inset: 0; z-index: 70; background: #050505; display: grid; place-items: center; clip-path: inset(0 0 100% 0); transition: clip-path .8s cubic-bezier(.7,0,.2,1); }
.at-menu.open { clip-path: inset(0 0 0 0); }
.at-menu nav { display: grid; gap: 6px; text-align: center; }
.at-menu nav a { font: 400 clamp(40px, 7vw, 86px)/1.05 "Instrument Serif"; text-decoration: none; opacity: .9; }
.at-menu nav a:hover { color: var(--accent); }
.at-menu .x { position: absolute; top: 22px; right: 30px; background: none; border: 0; color: #fff; font: 600 10px "Inter"; letter-spacing: .3em; cursor: pointer; }
.at-menu .c { position: absolute; bottom: 30px; font-size: 13px; opacity: .6; }

.at-hero { position: relative; height: 100svh; overflow: hidden; }
.at-hero .ph { position: absolute; inset: 0; transform-origin: 50% 62%; }
.at-hero .ph img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.5) contrast(1.1) saturate(1.05); }
.at-hero .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#050505 0%, rgba(5,5,5,.55) 28%, rgba(5,5,5,.05) 55%, rgba(5,5,5,.35) 82%, #050505 100%); }
.at-hero.nophoto .ph { background: radial-gradient(ellipse 60% 45% at 50% 78%, color-mix(in srgb, var(--accent) 45%, #050505), #050505 70%); }
.at-hero h1 { position: absolute; left: 0; right: 0; top: 19vh; margin: 0; text-align: center; font-size: clamp(44px, 6.3vw, 96px); line-height: 1.02; padding: 0 20px; }
.at-hero h1 span.l { display: block; }
.at-hero .cap { position: absolute; left: 50%; bottom: 7vh; translate: -50% 0; width: min(340px, 86vw); text-align: center; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.78); margin: 0; }

.at-statement { position: relative; height: 100svh; display: grid; place-items: center; overflow: hidden; text-align: center; }
.at-statement h2 { position: relative; z-index: 2; margin: 0; font-size: clamp(34px, 4.4vw, 64px); line-height: 1.08; padding: 0 20px; }
.at-cloud { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.at-cloud img { position: absolute; left: 50%; top: 50%; width: 120px; height: 88px; object-fit: cover; opacity: 0; }

.at-approach { padding: 16vh 6vw 12vh; display: grid; grid-template-columns: 1fr 1.3fr; gap: 6vw; align-items: start; }
.at-approach h2 { margin: 0; font-size: clamp(40px, 5vw, 76px); line-height: 1.02; }
.at-approach .big { position: relative; overflow: hidden; aspect-ratio: 16/10; background: #111; }
.at-approach .big img { width: 100%; height: 118%; object-fit: cover; }
.at-approach p { color: rgba(242,239,233,.66); max-width: 420px; }
.at-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px 46px; padding-top: 34px; border-top: 1px solid rgba(255,255,255,.1); font: 500 11px/1 "Inter"; letter-spacing: .26em; text-transform: uppercase; color: rgba(242,239,233,.55); }

.at-story { position: relative; height: 100svh; overflow: hidden; }
.at-story .bgs, .at-story .bgs img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.at-story .bgs img { filter: blur(26px) brightness(.4) saturate(.8); transform: scale(1.15); opacity: 0; }
.at-story .bgs.nophoto { background: radial-gradient(circle at 30% 60%, #1a1a1a, #050505 70%); }
.at-story .card { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: min(300px, 60vw); aspect-ratio: 4/5; overflow: hidden; background: #111; box-shadow: 0 40px 80px rgba(0,0,0,.6); }
.at-story .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.at-story .card .num { position: absolute; inset: 0; display: grid; place-items: center; font: 400 120px/1 "Instrument Serif"; color: rgba(255,255,255,.12); }
.at-story .lbl { position: absolute; right: 7vw; top: 50%; width: min(330px, 34vw); }
.at-story .lbl > div { position: absolute; left: 0; right: 0; top: 0; translate: 0 -50%; opacity: 0; }
.at-story .lbl h3 { margin: 0 0 14px; font-size: clamp(36px, 4vw, 58px); line-height: 1; }
.at-story .lbl p { margin: 0; font-size: 14px; color: rgba(242,239,233,.68); }
.at-story .count { position: absolute; left: 7vw; bottom: 7vh; font: 500 11px "Inter"; letter-spacing: .3em; color: rgba(255,255,255,.5); }

.at-fill { padding: 22vh 6vw; max-width: 1100px; }
.at-fill p { margin: 0; font-size: clamp(30px, 3.6vw, 54px); line-height: 1.12; }
.at-fill .w { color: rgba(242,239,233,.16); }

.at-split { display: grid; grid-template-columns: 1fr 1.1fr; }
.at-split .left { position: sticky; top: 0; height: 100svh; display: flex; align-items: center; padding: 0 6vw; }
.at-split .titles { position: relative; width: 100%; height: 260px; }
.at-split .titles > div { position: absolute; left: 0; right: 0; top: 50%; translate: 0 -50%; opacity: 0; }
.at-split .titles h3 { margin: 0 0 16px; font-size: clamp(44px, 5vw, 80px); line-height: 1; }
.at-split .titles p { margin: 0; color: rgba(242,239,233,.66); max-width: 380px; }
.at-split .titles small { display: block; margin-bottom: 18px; font: 500 11px "Inter"; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
.at-split .right > div { height: 100svh; position: relative; overflow: hidden; }
.at-split .right img { width: 100%; height: 120%; object-fit: cover; }
.at-split .right .ph-none { position: absolute; inset: 0; display: grid; place-items: center; background: #0c0c0c; font: 400 clamp(120px, 18vw, 280px)/1 "Instrument Serif"; color: rgba(255,255,255,.06); border-top: 1px solid rgba(255,255,255,.06); }

.at-ends { position: relative; height: 140svh; }
.at-ends .stick { position: sticky; top: 0; height: 100svh; display: grid; place-items: center; overflow: hidden; }
.at-ends .stick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.3) contrast(1.1); }
.at-ends h2 { position: relative; margin: 0; text-align: center; font-size: clamp(50px, 8vw, 130px); line-height: .98; padding: 0 20px; }
.at-ends .rate { position: relative; margin-top: 18px; text-align: center; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.7); }

.at-lead { padding: 18vh 6vw 10vh; display: grid; grid-template-columns: 1fr 1fr; gap: 6vw; }
.at-lead h2 { margin: 0 0 18px; font-size: clamp(44px, 5vw, 80px); line-height: 1; }
.at-lead p { color: rgba(242,239,233,.66); }
[data-style="atelier"] form input, [data-style="atelier"] form textarea { border-width: 0 0 1px; padding-left: 0; }
.at-btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 16px 30px; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; background: none; color: #fff; font: 600 11px "Inter"; letter-spacing: .26em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: background .3s, color .3s, border-color .3s; }
.at-btn:hover, .at-btn.fill { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.at-contacts { padding: 4vh 6vw 10vh; display: grid; grid-template-columns: 1fr 1.4fr; gap: 6vw; }
.at-contacts dl { margin: 0; }
.at-contacts dt { font: 500 11px "Inter"; letter-spacing: .3em; text-transform: uppercase; color: rgba(242,239,233,.5); margin-top: 26px; }
.at-contacts dd { margin: 8px 0 0; font: 400 26px/1.2 "Instrument Serif"; }
.at-contacts dd a { text-decoration: none; } .at-contacts dd a:hover { color: var(--accent); }
[data-style="atelier"] .map iframe { filter: grayscale(1) invert(.92) contrast(.9); min-height: 420px; }
.at-foot { padding: 0 6vw 40px; }
.at-foot .mark { font: 400 clamp(80px, 17vw, 300px)/.8 "Instrument Serif"; text-align: center; color: #161616; white-space: nowrap; overflow: hidden; }
.at-foot .row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; padding-top: 26px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; color: rgba(242,239,233,.5); }
.at-foot .row a { text-decoration: none; margin-left: 18px; } .at-foot .row a:hover { color: #fff; }

/* ====================== MONO (STANQ) ====================== */
[data-style="mono"] body { background: #e7e6e2; color: #0d0d0d; --fl: rgba(0,0,0,.2); }
.mn-bar { background: #0d0d0d; color: #f2f1ed; font-size: 12px; }
.mn-bar .in { max-width: 1440px; margin: 0 auto; padding: 0 36px; height: 30px; display: flex; align-items: center; justify-content: space-between; }
.mn-head { position: sticky; top: 0; z-index: 50; background: #e7e6e2; }
.mn-head .in { max-width: 1440px; margin: 0 auto; padding: 0 36px; height: 84px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.mn-head nav { display: flex; gap: 42px; font-size: 14px; }
.mn-head nav a, .mn-tools a { text-decoration: none; }
.mn-logo { font: 800 34px/1 "Archivo"; font-stretch: 125%; letter-spacing: .02em; text-transform: uppercase; text-decoration: none; }
.mn-tools { justify-self: end; display: flex; gap: 30px; font-size: 13px; }
.mn-tools a { display: inline-flex; align-items: center; gap: 8px; }
.mn-tools svg { width: 18px; height: 18px; }
.mn-hero { position: relative; height: calc(100svh - 114px); min-height: 640px; max-height: 900px; overflow: hidden; background: linear-gradient(#ecebe7, #dfded9); }
.mn-hero .giant { position: absolute; left: 0; right: 0; top: 53%; translate: 0 -50%; text-align: center; font: 800 100px/.8 "Archivo"; letter-spacing: -.035em; text-transform: uppercase; white-space: nowrap; margin: 0; }
.mn-hero .giant .clip { display: inline-block; overflow: hidden; padding: .04em 0 .02em; vertical-align: top; }
.mn-hero .giant .ch { display: inline-block; }
.mn-hero .obj { position: absolute; left: 50%; top: 7%; height: 80%; aspect-ratio: 3/4; translate: -50% 0; overflow: hidden; box-shadow: 0 50px 80px -30px rgba(0,0,0,.45); }
.mn-hero .obj img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08); }
.mn-hero .plinth { position: absolute; left: 50%; bottom: 0; translate: -50% 0; width: 26%; height: 14%; background: linear-gradient(#cfcfcb, #b5b5b0); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
.mn-sp { font: 500 12px/2 "Archivo"; letter-spacing: .34em; text-transform: uppercase; }
.mn-sp::after { content: ""; display: block; width: 50px; height: 1px; background: currentColor; margin-top: 12px; }
.mn-hero .tl { position: absolute; left: 6.8%; top: 17%; max-width: 230px; }
.mn-hero .br { position: absolute; right: 5.5%; bottom: 11%; max-width: 250px; }
.mn-hero .bl { position: absolute; left: 3.3%; bottom: 11%; display: flex; gap: 30px; align-items: center; }
.mn-btn { display: inline-flex; align-items: center; justify-content: center; padding: 17px 26px; background: #0d0d0d; color: #f2f1ed; font: 500 12px/1 "Archivo"; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; border: 0; cursor: pointer; transition: background .3s; }
.mn-btn:hover { background: #333; }
.mn-link { font: 500 12px/1 "Archivo"; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; padding-bottom: 6px; border-bottom: 1px solid currentColor; }
.mn-band { background: #0d0d0d; color: #f2f1ed; }
.mn-band .in { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.mn-band a { display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 26px; padding: 30px; text-decoration: none; border-left: 1px solid rgba(255,255,255,.18); min-height: 168px; }
.mn-band a:first-child { border-left: 0; }
.mn-band .th { height: 120px; overflow: hidden; display: grid; place-items: center; }
.mn-band .th img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: transform .8s; }
.mn-band a:hover .th img { transform: scale(1.06); }
.mn-band .th b { font: 800 64px/1 "Archivo"; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.5); }
.mn-band span { font-size: 16px; } .mn-band i { display: block; font-style: normal; font-size: 22px; margin-top: 10px; transition: translate .3s; }
.mn-band a:hover i { translate: 8px 0; }
.mn-banner { position: relative; height: 470px; overflow: hidden; background: #d9d8d3; }
.mn-banner .img { position: absolute; inset: -10% 0 -10% 30%; }
.mn-banner .img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.mn-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #e2e1dd 0%, #e2e1dd 30%, rgba(226,225,221,0) 58%); }
.mn-banner .tx { position: relative; z-index: 2; max-width: 1440px; margin: 0 auto; padding: 0 0 0 7%; height: 100%; display: flex; flex-direction: column; justify-content: center; }
.mn-banner h2 { margin: 0 0 18px; font: 800 clamp(36px, 3.7vw, 54px)/1.02 "Archivo"; text-transform: uppercase; max-width: 520px; letter-spacing: -.01em; }
.mn-banner p { margin: 0 0 30px; font-size: 16px; max-width: 320px; }
.mn-banner .nophoto { position: absolute; right: -2%; top: 50%; translate: 0 -50%; font: 800 clamp(160px, 26vw, 420px)/.8 "Archivo"; color: rgba(0,0,0,.05); text-transform: uppercase; white-space: nowrap; }
.mn-cat { background: #fff; padding: 64px 0 80px; }
.mn-cat .in, .mn-sec .in { max-width: 1440px; margin: 0 auto; padding: 0 36px; }
.mn-cat .hd { display: flex; justify-content: space-between; align-items: end; margin-bottom: 34px; }
.mn-cat h2, .mn-sec h2 { margin: 0; font: 700 28px/1.1 "Archivo"; text-transform: uppercase; letter-spacing: -.01em; }
.mn-cat .all { font-size: 13px; text-decoration: none; padding-bottom: 4px; border-bottom: 1px solid currentColor; }
.mn-cat .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.mn-card { border: 1px solid #e6e6e6; background: #fff; padding: 16px; display: flex; flex-direction: column; transition: box-shadow .4s, translate .4s; }
.mn-card:hover { box-shadow: 0 24px 40px -24px rgba(0,0,0,.3); translate: 0 -4px; }
.mn-card .im { height: 200px; display: grid; place-items: center; overflow: hidden; background: #f3f3f1; margin-bottom: 18px; }
.mn-card .im img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
.mn-card .im b { font: 800 90px/1 "Archivo"; color: transparent; -webkit-text-stroke: 1px #c9c9c5; }
.mn-card h3 { margin: 0 0 6px; font: 500 14px/1.35 "Inter"; }
.mn-card p { margin: 0 0 16px; font-size: 13px; color: #666; }
.mn-card .ft { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font: 700 14px "Inter"; }
.mn-card .plus { width: 34px; height: 34px; display: grid; place-items: center; background: #0d0d0d; color: #fff; text-decoration: none; font-size: 20px; transition: rotate .4s; }
.mn-card:hover .plus { rotate: 90deg; }
.mn-sec { padding: 90px 0; }
.mn-why { display: grid; grid-template-columns: 1fr 1fr; gap: 0 70px; margin-top: 40px; }
.mn-why .it { padding: 24px 0; border-top: 1px solid rgba(0,0,0,.14); display: grid; grid-template-columns: 70px 1fr; }
.mn-why .it b { font: 700 15px "Archivo"; text-transform: uppercase; } .mn-why .it p { margin: 6px 0 0; color: #555; }
.mn-why .it i { font: 500 12px "Archivo"; font-style: normal; letter-spacing: .2em; }
.mn-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(0,0,0,.14); border-bottom: 1px solid rgba(0,0,0,.14); margin-top: 40px; }
.mn-stats div { padding: 34px 0; } .mn-stats b { display: block; font: 800 64px/1 "Archivo"; } .mn-stats span { font-size: 13px; color: #555; }
.mn-lead { background: #0d0d0d; color: #f2f1ed; --fl: rgba(255,255,255,.25); }
.mn-lead .in { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; }
.mn-lead h2 { font-size: 40px !important; margin-bottom: 18px !important; }
.mn-lead .mn-btn { background: #f2f1ed; color: #0d0d0d; }
.mn-contacts { display: grid; grid-template-columns: 1fr 1.4fr; gap: 50px; }
.mn-contacts dl { margin: 0; }
.mn-contacts dt { font: 500 11px "Archivo"; letter-spacing: .3em; text-transform: uppercase; color: #666; margin-top: 24px; }
.mn-contacts dd { margin: 6px 0 0; font: 700 20px/1.3 "Archivo"; } .mn-contacts dd a { text-decoration: none; }
[data-style="mono"] .map iframe { filter: grayscale(1) contrast(1.05); min-height: 400px; }
.mn-foot { background: #0d0d0d; color: #f2f1ed; padding: 50px 0 34px; }
.mn-foot .in { max-width: 1440px; margin: 0 auto; padding: 0 36px; overflow: hidden; }
.mn-foot .big { font: 800 clamp(70px, 14vw, 230px)/.8 "Archivo"; font-stretch: 125%; text-transform: uppercase; white-space: nowrap; color: #1d1d1d; }
.mn-foot .row { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 30px; font-size: 12px; color: #8a8a86; }
.mn-foot a { text-decoration: none; margin-left: 18px; } .mn-foot a:hover { color: #fff; }

/* ====================== BOLD (MLK logistics) ====================== */
[data-style="bold"] body { background: #fff; color: #111; --fl: rgba(0,0,0,.18); }
.bd-wrap { max-width: 1400px; margin: 0 auto; padding: 0 32px; }
.bd-cond { font-family: "Bebas Neue", "Archivo", sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 0; line-height: .9; }
.bd-hero { padding-top: 32px; }
.bd-panel { position: relative; height: min(690px, calc(100svh - 64px)); min-height: 560px; border-radius: 34px; overflow: hidden; color: #fff; background: #1b1b1b; }
.bd-panel .bg { position: absolute; inset: -6% 0 0; }
.bd-panel .bg img { width: 100%; height: 100%; object-fit: cover; }
.bd-panel .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.66), rgba(0,0,0,.08) 55%, rgba(0,0,0,.25)); }

    stl.to(imgs, { opacity: 0, scale: .6, duration: .4, stagger: .02 }, 1.7);
    // 3. approach: heading letters, photo opening like a curtain, parallax inside
    gsap.from(splitText(document.querySelector(".at-approach h2"), "ch"), { opacity: 0, filter: "blur(10px)", x: -10, stagger: .02, duration: 1, scrollTrigger: { trigger: ".at-approach", start: "top 70%" } });
    gsap.fromTo(".at-approach .big", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.6, ease: "power4.inOut", scrollTrigger: { trigger: ".at-approach .big", start: "top 80%" } });
    gsap.fromTo(".at-approach .big img", { yPercent: -12 }, { yPercent: 0, ease: "none", scrollTrigger: { trigger: ".at-approach .big", scrub: true } });
    gsap.from(".at-row span", { opacity: 0, y: 12, stagger: .06, duration: .8, scrollTrigger: { trigger: ".at-row", start: "top 90%" } });
    // 4. pinned story: blurred background, centred card and the label change step by step
    var story = document.querySelector(".at-story");
    if (story) {
      var lbls = story.querySelectorAll(".lbl > div"), bgs = story.querySelectorAll(".bgs img"), cards = story.querySelectorAll(".card img"), n = lbls.length;
      gsap.set([lbls[0], bgs[0], cards[0]].filter(Boolean), { opacity: 1 });
      var sl = gsap.timeline({ scrollTrigger: { trigger: story, start: "top top", end: "+=" + n * 90 + "%", scrub: 1, pin: true,
        onUpdate: function (s) { document.getElementById("storyN").textContent = nn(Math.min(n - 1, Math.floor(s.progress * n))); } } });
      sl.from(story.querySelector(".card"), { scale: .7, opacity: 0, duration: .5 }, 0);
      for (var k = 1; k < n; k++) {
        sl.to(lbls[k - 1], { opacity: 0, filter: "blur(10px)", y: -30, duration: .5 }, k)
          .fromTo(lbls[k], { opacity: 0, filter: "blur(10px)", y: 30 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: .5 }, k + .3);
        if (bgs[k]) sl.to(bgs[k - 1], { opacity: 0, duration: .6 }, k).to(bgs[k], { opacity: 1, duration: .6 }, k);
        if (cards[k]) sl.fromTo(cards[k], { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: .6 }, k);
      }
      sl.to({}, { duration: .6 });
    }
    // 5. paragraph fills with light word by word while scrolling
    gsap.to(splitText(document.querySelector(".at-fill p"), "w"), { color: "#f2efe9", stagger: .1, ease: "none", scrollTrigger: { trigger: ".at-fill", start: "top 75%", end: "bottom 45%", scrub: true } });
    // 6. split screen: titles on the left swap through blur while photos scroll on the right
    var tt = document.querySelectorAll(".at-split .titles > div"), rr = document.querySelectorAll(".at-split .right > div");
    if (desktop) {
      gsap.set(tt[0], { opacity: 1 });
      var showT = function (on) { tt.forEach(function (t, j) { gsap.to(t, { opacity: j === on ? 1 : 0, filter: j === on ? "blur(0px)" : "blur(10px)", y: j === on ? 0 : (j < on ? -30 : 30), duration: .6, overwrite: true }); }); };
      rr.forEach(function (r, i) {
        var im = r.querySelector("img"); if (im) gsap.fromTo(im, { yPercent: -10 }, { yPercent: 0, ease: "none", scrollTrigger: { trigger: r, scrub: true } });
        ScrollTrigger.create({ trigger: r, start: "top 55%", end: "bottom 55%", onEnter: function () { showT(i); }, onEnterBack: function () { showT(i); } });
      });
    } else {
      tt.forEach(function (t) { gsap.from(t, { opacity: 0, y: 30, duration: 1, scrollTrigger: { trigger: t, start: "top 85%" } }); });
    }
    // 7. finale: photo drifts behind, words come out of blur from the centre
    gsap.fromTo(".at-ends .stick img", { scale: 1.25, yPercent: 8 }, { scale: 1, yPercent: -4, ease: "none", scrollTrigger: { trigger: ".at-ends", start: "top bottom", end: "bottom bottom", scrub: true } });
    gsap.from(splitText(document.querySelector(".at-ends h2"), "ch"), { opacity: 0, filter: "blur(16px)", scale: 1.3, stagger: { each: .03, from: "center" }, ease: "none", scrollTrigger: { trigger: ".at-ends", start: "top 60%", end: "top top", scrub: 1 } });
    gsap.from(".at-lead > *", { opacity: 0, y: 40, duration: 1.1, stagger: .12, scrollTrigger: { trigger: ".at-lead", start: "top 75%" } });
    gsap.from(".at-contacts > *", { opacity: 0, y: 40, duration: 1.1, stagger: .12, scrollTrigger: { trigger: ".at-contacts", start: "top 80%" } });
    gsap.from(".at-foot .mark", { yPercent: 60, opacity: 0, duration: 1.4, ease: "power3.out", scrollTrigger: { trigger: ".at-foot", start: "top 95%" } });
  }

  if (ST === "mono") {
    // hero: header settles, giant letters rise from below one by one, the photo lifts onto its plinth
    gsap.timeline({ defaults: { ease: "power4.out" } })
      .from(".mn-bar, .mn-head", { y: -30, opacity: 0, duration: .9, stagger: .1 })
      .from(".mn-hero .giant .ch", { yPercent: 110, duration: 1.2, stagger: .05 }, .2)
      .from(".mn-hero .plinth", { scaleX: 0, duration: 1 }, .5)
      .from(".mn-hero .obj", { y: 120, opacity: 0, duration: 1.4 }, .55)
      .from(".mn-hero .obj img", { scale: 1.25, duration: 1.8 }, .55)
      .from(".mn-hero .tl, .mn-hero .br, .mn-hero .bl", { opacity: 0, y: 24, duration: 1, stagger: .12 }, .9);
    if (desktop) {
      gsap.to(".mn-hero .giant", { yPercent: -18, ease: "none", scrollTrigger: { trigger: ".mn-hero", start: "top top", end: "bottom top", scrub: true } });
      gsap.to(".mn-hero .obj", { y: -90, ease: "none", scrollTrigger: { trigger: ".mn-hero", start: "top top", end: "bottom top", scrub: true } });
    }
    gsap.from(".mn-band a", { opacity: 0, y: 40, duration: 1, stagger: .12, scrollTrigger: { trigger: ".mn-band", start: "top 92%" } });
    gsap.fromTo(".mn-banner .img img", { scale: 1.2 }, { scale: 1, ease: "none", scrollTrigger: { trigger: ".mn-banner", scrub: true } });
    gsap.from(".mn-banner .tx > *", { opacity: 0, x: -50, duration: 1.1, stagger: .12, ease: "power3.out", scrollTrigger: { trigger: ".mn-banner", start: "top 70%" } });
    gsap.from(".mn-cat .hd > *", { opacity: 0, y: 30, duration: .9, stagger: .08, scrollTrigger: { trigger: ".mn-cat", start: "top 80%" } });
    gsap.from(".mn-card", { opacity: 0, y: 60, duration: 1, stagger: .08, ease: "power3.out", scrollTrigger: { trigger: ".mn-cat .g", start: "top 85%" } });
    gsap.utils.toArray(".mn-sec h2, .mn-why .it, .mn-stats > div").forEach(function (el) { gsap.from(el, { opacity: 0, y: 30, duration: .9, scrollTrigger: { trigger: el, start: "top 90%" } }); });
    gsap.from(".mn-foot .big", { yPercent: 70, duration: 1.4, ease: "power4.out", scrollTrigger: { trigger: ".mn-foot", start: "top 95%" } });
  }

  if (ST === "bold") {
    // hero: panel opens from the centre, photo settles, headline lines slide in from opposite sides, notches and pills follow
    gsap.timeline({ defaults: { ease: "power4.out" } })
      .from(".bd-panel", { clipPath: "inset(12% 18% 12% 18% round 34px)", duration: 1.5, ease: "power3.inOut" })
      .from(".bd-panel .bg img", { scale: 1.3, duration: 2.2 }, 0)
      .from(".bd-logo, .bd-nav", { y: -30, opacity: 0, duration: 1, stagger: .1 }, .8)
      .from(".bd-notch-tr", { xPercent: 100, duration: 1 }, .9)
      .from(".bd-h1 .l1 .t", { xPercent: -40, opacity: 0, duration: 1.3 }, .9)
      .from(".bd-h1 .l2 .t", { xPercent: 40, opacity: 0, duration: 1.3 }, 1)
      .from(".bd-h1 small", { opacity: 0, y: 14, duration: .8 }, 1.3)
      .from(".bd-chips a", { y: 30, opacity: 0, duration: .8, stagger: .08 }, 1.25)
      .from(".bd-notch-bl", { yPercent: 100, duration: 1 }, 1.1);
    gsap.to(".bd-panel .bg", { yPercent: 10, ease: "none", scrollTrigger: { trigger: ".bd-panel", start: "top top", end: "bottom top", scrub: true } });
    gsap.from(".bd-col .a", { x: -80, opacity: 0, duration: 1.2, ease: "power3.out", scrollTrigger: { trigger: ".bd-why", start: "top 75%" } });
    gsap.from(".bd-col .b", { y: 80, opacity: 0, duration: 1.2, delay: .15, ease: "power3.out", scrollTrigger: { trigger: ".bd-why", start: "top 75%" } });
    gsap.from(".bd-col .hd > *, .bd-list .it", { opacity: 0, y: 30, duration: .9, stagger: .12, scrollTrigger: { trigger: ".bd-why", start: "top 70%" } });
    // chevrons light up one after another, like arrows moving forward
    gsap.fromTo(".bd-chev svg", { opacity: .2, x: -20 }, { opacity: 1, x: 0, duration: .6, stagger: .15, ease: "power2.out", scrollTrigger: { trigger: ".bd-svc", start: "top 80%" },
      onComplete: function () { gsap.to(".bd-chev svg", { opacity: .35, duration: .5, stagger: { each: .15, repeat: -1, yoyo: true } }); } });
    gsap.from(".bd-svc h2, .bd-svc .hd p", { opacity: 0, y: 30, duration: .9, stagger: .1, scrollTrigger: { trigger: ".bd-svc", start: "top 80%" } });
    gsap.from(".bd-card", { x: 120, opacity: 0, duration: 1.1, stagger: .09, ease: "power3.out", scrollTrigger: { trigger: ".bd-track", start: "top 88%" } });
    gsap.from(".bd-dots", { opacity: 0, scale: .9, duration: 1.6, scrollTrigger: { trigger: ".bd-stats", start: "top 80%" } });
    gsap.from(".bd-nums div", { opacity: 0, y: 40, duration: 1, stagger: .2, scrollTrigger: { trigger: ".bd-stats", start: "top 75%" } });
    gsap.from(".bd-stats h2, .bd-stats .txt > *", { opacity: 0, y: 30, duration: .9, stagger: .1, scrollTrigger: { trigger: ".bd-stats", start: "top 70%" } });
    gsap.from(".bd-lead", { clipPath: "inset(10% 6% 10% 6% round 34px)", duration: 1.3, ease: "power3.inOut", scrollTrigger: { trigger: ".bd-lead", start: "top 88%" } });
  }
  addEventListener("load", function () { ScrollTrigger.refresh(); });
})();
</script>
</body>
</html>
